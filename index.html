<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Clima en el Perú</title>

  <meta name="description" content="Consulta el clima actual de diferentes ciudades del Perú, incluyendo temperatura, humedad y velocidad del viento.">

  <meta name="keywords" content="clima, Perú, temperatura, Lima, Cusco, Arequipa, pronóstico del tiempo">

  <!-- Open Graph -->
  <meta property="og:title" content="Clima en el Perú">

  <meta property="og:description" content="Consulta la temperatura, humedad y viento de diferentes ciudades del Perú.">

  <meta property="og:type" content="website">

  <meta property="og:image" content="https://clima-peru.netlify.app/imagenes/clima.jpg">

  <meta property="og:url" content="https://clima-peru.netlify.app">

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <header>
  <h1>Aplicación de clima</h1>
  <h3>Clima en el Perú</h3>
  <p>Elige una ciudad y mira su clima actual.</p>
</header>

  <main>
    <section class="buscador">

      <select id="selectorCiudad">
        <option value="lima">Lima</option>
        <option value="cusco">Cusco</option>
        <option value="arequipa">Arequipa</option>
        <option value="trujillo">Trujillo</option>
        <option value="piura">Piura</option>
        <option value="iquitos">Iquitos</option>
      </select>

      <button id="btnConsultar">Ver clima</button>

    </section>

    <p id="mensajeError" class="error"></p>

    <section id="resultado"></section>
  </main>

  <footer>
    <p>&copy;Derechos reservados a Carlos Durand</p>
  </footer>

  <script src="app.js"></script>
